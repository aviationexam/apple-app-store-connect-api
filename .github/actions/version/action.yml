name: "Create version"
description: "Create version"
outputs:
  enhancedVersion:
    description: "Enhanced version"
    value: ${{ steps.version.outputs.enhancedVersion }}
runs:
  using: "composite"
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v5.0.0
      with:
        versionSpec: '7.0.x'
    - name: Use GitVersion
      id: gitversion # step id used as reference for output values
      uses: gittools/actions/gitversion/execute@v5.0.0
    - run: |
        echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "VersionSourceDistance: ${{ steps.gitversion.outputs.versionSourceDistance }}"
      shell: bash
    - name: Create version
      run: |
        ENHANCED_VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
        if [[ -f "src/Apple.AppStoreConnect/api-version.txt" ]]; then ENHANCED_VERSION="${ENHANCED_VERSION}.$(sed '2q;d' src/Apple.AppStoreConnect/api-version.txt)"; fi
        if [[ "${{ steps.gitversion.outputs.preReleaseLabel }}" != '' ]]; then ENHANCED_VERSION="${ENHANCED_VERSION}-${{ steps.gitversion.outputs.preReleaseLabel }}"; fi
        echo "enhancedVersion=${ENHANCED_VERSION}" >> "$GITHUB_OUTPUT"
      id: version
      shell: bash
